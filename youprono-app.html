<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>YouProno</title>
<script>
  // Le jeu vit desormais dans index.html, a la racine du site. Cette page ne
  // contient plus que la redirection : tous les liens WhatsApp deja partages
  // pointent sur youprono-app.html et doivent continuer de fonctionner.
  //
  // location.search transporte le code d'invitation (?groupe=ABCDEF) et
  // location.hash l'ecran demande (#salon/...). Les deux sont conserves.
  //
  // replace plutot que href : aucune entree n'est ajoutee a l'historique, donc
  // le bouton « precedent » ne ramene pas sur cette page.
  location.replace('/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/">
</head>
<body>
  <p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <a href="/">Ouvrir YouProno</a>
  </p>
</body>
</html>
